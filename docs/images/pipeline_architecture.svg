<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Drop Shadows & Glows -->
    <filter id="glow-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
    .title { font-weight: 800; font-size: 26px; fill: #f8fafc; letter-spacing: -0.5px; }
    .subtitle { font-weight: 400; font-size: 14px; fill: #94a3b8; }
    .card-title { font-weight: 700; font-size: 15px; fill: #f1f5f9; }
    .card-desc { font-weight: 400; font-size: 11.5px; fill: #94a3b8; line-height: 1.4; }
    .tag { font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .zone-title { font-weight: 700; font-size: 12px; fill: #64748b; letter-spacing: 1px; text-transform: uppercase; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bg-grad)" rx="16" />
  
  <!-- Subtle Grid Pattern Overlay -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="680" />
    <line x1="480" y1="0" x2="480" y2="680" />
    <line x1="720" y1="0" x2="720" y2="680" />
    <line x1="960" y1="0" x2="960" y2="680" />
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 48)">
    <circle cx="20" cy="18" r="16" fill="url(#primary-grad)" />
    <path d="M12 18 L18 24 L28 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="50" y="16" class="font-sans title">Universal Data Engineering Pipeline</text>
    <text x="50" y="36" class="font-sans subtitle">End-to-End Enterprise Architecture: Multi-Format Ingestion to BI &amp; Interactive Web Analytics</text>
    
    <!-- Health / Ready Badges -->
    <rect x="940" y="4" width="160" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
    <circle cx="956" cy="18" r="4" fill="#34d399" />
    <text x="968" y="22" class="font-sans font-mono" font-size="11" font-weight="600" fill="#a7f3d0">PRODUCTION READY</text>
  </g>

  <!-- Flow Zone 1: Ingestion & Profiling -->
  <g transform="translate(50, 110)">
    <text x="0" y="-8" class="font-sans zone-title">01 • Ingestion &amp; Discovery</text>
    
    <!-- Raw Landing Zone -->
    <g transform="translate(0, 10)">
      <rect width="200" height="130" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="21" y="32" class="font-mono" font-size="14" fill="#60a5fa">📥</text>
      <text x="50" y="26" class="font-sans card-title">Landing Zone</text>
      <text x="50" y="40" class="font-mono tag" fill="#60a5fa">data/raw/ • IMMUTABLE</text>
      <text x="14" y="68" class="font-sans card-desc">• CSV (Multi-Encoding UTF8/Latin)</text>
      <text x="14" y="86" class="font-sans card-desc">• Excel (.xlsx via OpenPyXL)</text>
      <text x="14" y="104" class="font-sans card-desc">• JSON (Tabular / Columnar / Flat)</text>
    </g>

    <!-- Stage 2 & 3: Profiling & Schema -->
    <g transform="translate(0, 165)">
      <rect width="200" height="130" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="21" y="32" class="font-mono" font-size="14" fill="#22d3ee">🔍</text>
      <text x="50" y="26" class="font-sans card-title">Schema &amp; Profile</text>
      <text x="50" y="40" class="font-mono tag" fill="#22d3ee">STAGES 2 &amp; 3</text>
      <text x="14" y="68" class="font-sans card-desc">• 6 Domain-Agnostic Types</text>
      <text x="14" y="86" class="font-sans card-desc">• Null, Cardinality, Stats &amp; IQRs</text>
      <text x="14" y="104" class="font-sans card-desc">• Automated JSON / CSV Audit</text>
    </g>
  </g>

  <!-- Connectors Zone 1 to Zone 2 -->
  <path d="M 250 185 L 290 185" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 250 340 L 290 340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Flow Zone 2: Cleaning, Transformation & Validation Gate -->
  <g transform="translate(295, 110)">
    <text x="0" y="-8" class="font-sans zone-title">02 • Transformation &amp; Quality</text>

    <!-- Stage 4: Cleaning & Transform Engine -->
    <g transform="translate(0, 10)">
      <rect width="210" height="130" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="21" y="32" class="font-mono" font-size="14" fill="#a78bfa">⚡</text>
      <text x="50" y="26" class="font-sans card-title">Data Cleaning</text>
      <text x="50" y="40" class="font-mono tag" fill="#a78bfa">STAGE 4 • TRANSFORM</text>
      <text x="14" y="68" class="font-sans card-desc">• Header Sanitization &amp; Whitespace</text>
      <text x="14" y="86" class="font-sans card-desc">• Missing Value Imputation</text>
      <text x="14" y="104" class="font-sans card-desc">• Output: data/processed/</text>
    </g>

    <!-- Stage 5: Validation & Quality Gate -->
    <g transform="translate(0, 165)">
      <rect width="210" height="130" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="21" y="32" class="font-mono" font-size="14" fill="#fbbf24">🛡️</text>
      <text x="50" y="26" class="font-sans card-title">Quality Gate</text>
      <text x="50" y="40" class="font-mono tag" fill="#fbbf24">STAGE 5 • VALIDATE</text>
      <text x="14" y="68" class="font-sans card-desc">• Null, Range, Set &amp; Regex Rules</text>
      <text x="14" y="86" class="font-sans card-desc">• Transparent Quality Score %</text>
      <text x="14" y="104" class="font-sans card-desc">• Clean Split: Valid vs Rejected</text>
    </g>
  </g>

  <!-- Quality Branching (Validated vs Rejected) -->
  <!-- Validated to Storage -->
  <path d="M 505 340 L 545 340" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <!-- Quarantined branch -->
  <path d="M 505 365 L 530 365 L 530 460 L 545 460" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-rose)" />

  <!-- Flow Zone 3: Storage & Database -->
  <g transform="translate(550, 110)">
    <text x="0" y="-8" class="font-sans zone-title">03 • Storage &amp; Database</text>

    <!-- PostgreSQL / Dynamic Modeling -->
    <g transform="translate(0, 10)">
      <rect width="215" height="130" rx="10" fill="url(#card-grad)" stroke="#1e3a8a" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="21" y="32" class="font-mono" font-size="14" fill="#60a5fa">🐘</text>
      <text x="50" y="26" class="font-sans card-title">PostgreSQL Warehouse</text>
      <text x="50" y="40" class="font-mono tag" fill="#60a5fa">STAGE 6 • RELATIONAL</text>
      <text x="14" y="68" class="font-sans card-desc">• Dynamic Table &amp; Type Mapping</text>
      <text x="14" y="86" class="font-sans card-desc">• Batch Upsert &amp; Safe Fallback</text>
      <text x="14" y="104" class="font-sans card-desc">• Zero-Credential Leak Masking</text>
    </g>

    <!-- Validated Records Cache -->
    <g transform="translate(0, 165)">
      <rect width="215" height="75" rx="10" fill="url(#card-grad)" stroke="#065f46" stroke-width="1.5" filter="url(#card-shadow)" />
      <circle cx="28" cy="38" r="14" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="21" y="43" class="font-mono" font-size="14" fill="#34d399">✓</text>
      <text x="52" y="32" class="font-sans card-title" fill="#a7f3d0">Validated Store</text>
      <text x="52" y="48" class="font-mono tag" fill="#34d399">data/validated/ • READY</text>
    </g>

    <!-- Quarantined Storage -->
    <g transform="translate(0, 260)">
      <rect width="215" height="75" rx="10" fill="url(#card-grad)" stroke="#881337" stroke-width="1.5" filter="url(#card-shadow)" />
      <circle cx="28" cy="38" r="14" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" />
      <text x="21" y="43" class="font-mono" font-size="14" fill="#fb7185">⚠</text>
      <text x="52" y="32" class="font-sans card-title" fill="#fecdd3">Rejected Records</text>
      <text x="52" y="48" class="font-mono tag" fill="#fb7185">data/rejected/ • AUDIT TAGGED</text>
    </g>
  </g>

  <!-- Connectors Zone 3 to Zone 4 -->
  <path d="M 765 185 L 805 185" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 765 240 L 785 240 L 785 340 L 805 340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Flow Zone 4: Analytics & Presentation Layer -->
  <g transform="translate(810, 110)">
    <text x="0" y="-8" class="font-sans zone-title">04 • Analytics &amp; Presentation</text>

    <!-- Interactive Flask Dashboard -->
    <g transform="translate(0, 10)">
      <rect width="340" height="135" rx="10" fill="url(#card-grad)" stroke="#6366f1" stroke-width="2" filter="url(#card-shadow)" />
      <rect x="14" y="14" width="30" height="30" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
      <text x="21" y="34" class="font-mono" font-size="16" fill="#a5b4fc">📊</text>
      <text x="54" y="26" class="font-sans card-title" fill="#e0e7ff">Interactive Web Dashboard</text>
      <text x="54" y="42" class="font-mono tag" fill="#818cf8">FLASK • CHART.JS • ZONE 1-4 ARCHITECTURE</text>
      <text x="14" y="72" class="font-sans card-desc">• Executive KPIs, Health Badges &amp; Dynamic Slicers</text>
      <text x="14" y="90" class="font-sans card-desc">• Auto-Selected Bar, Line, Donut &amp; Histogram Visuals</text>
      <text x="14" y="108" class="font-sans card-desc">• Live Pipeline Runner, File Upload &amp; Data Table Explorer</text>
    </g>

    <!-- Power BI & Semantic Layer -->
    <g transform="translate(0, 160)">
      <rect width="340" height="120" rx="10" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="14" y="14" width="30" height="30" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
      <text x="21" y="34" class="font-mono" font-size="16" fill="#fde68a">📈</text>
      <text x="54" y="26" class="font-sans card-title" fill="#fef3c7">Power BI Semantic Model</text>
      <text x="54" y="42" class="font-mono tag" fill="#fbbf24">STAGE 10 • DAX LIBRARY &amp; STAR SCHEMA</text>
      <text x="14" y="72" class="font-sans card-desc">• Concrete &amp; Generic DAX Measures Library</text>
      <text x="14" y="90" class="font-sans card-desc">• Time Intelligence, RLS &amp; Scheduled Refresh Guide</text>
    </g>

    <!-- SQL Analytics Layer -->
    <g transform="translate(0, 295)">
      <rect width="340" height="85" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="21" y="32" class="font-mono" font-size="14" fill="#38bdf8">⚡</text>
      <text x="50" y="26" class="font-sans card-title">SQL Analytics Library</text>
      <text x="50" y="40" class="font-mono tag" fill="#38bdf8">STAGE 9 • 7 PARAMETERIZED QUERIES</text>
      <text x="14" y="68" class="font-sans card-desc">Aggregates, Running Totals, Rankings &amp; Trends</text>
    </g>
  </g>

  <!-- Flow Zone 5: Cross-Cutting Orchestration, CDC & Production Observability (Bottom Banner) -->
  <g transform="translate(50, 520)">
    <rect width="1100" height="120" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" filter="url(#card-shadow)" />
    
    <!-- Left badge -->
    <g transform="translate(24, 20)">
      <rect width="120" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="12" y="17" class="font-mono tag" fill="#a5b4fc">CORE ENGINES</text>
      <text x="0" y="50" class="font-sans" font-size="14" font-weight="700" fill="#f1f5f9">Orchestration &amp;</text>
      <text x="0" y="68" class="font-sans" font-size="14" font-weight="700" fill="#f1f5f9">Observability</text>
    </g>

    <!-- Engine 1: Stage 7 Orchestrator -->
    <g transform="translate(180, 20)">
      <text x="0" y="16" class="font-sans card-title" font-size="13">Stage 7: Orchestrator</text>
      <text x="0" y="34" class="font-mono tag" fill="#60a5fa">DAG Execution</text>
      <text x="0" y="54" class="font-sans card-desc">• 11-Stage Pipeline Driver</text>
      <text x="0" y="70" class="font-sans card-desc">• Error Classification &amp; Masking</text>
    </g>

    <!-- Engine 2: Stage 8 Incremental CDC -->
    <g transform="translate(410, 20)">
      <text x="0" y="16" class="font-sans card-title" font-size="13">Stage 8: Incremental CDC</text>
      <text x="0" y="34" class="font-mono tag" fill="#34d399">Delta Tracking</text>
      <text x="0" y="54" class="font-sans card-desc">• SHA-256 Checksum Hashing</text>
      <text x="0" y="70" class="font-sans card-desc">• Unchanged Skip / Changed Reprocess</text>
    </g>

    <!-- Engine 3: Lineage & Audit Reports -->
    <g transform="translate(640, 20)">
      <text x="0" y="16" class="font-sans card-title" font-size="13">Reports &amp; Lineage</text>
      <text x="0" y="34" class="font-mono tag" fill="#fbbf24">Dual JSON + CSV</text>
      <text x="0" y="54" class="font-sans card-desc">• End-to-End Field Traceability</text>
      <text x="0" y="70" class="font-sans card-desc">• Audit Trail in reports/</text>
    </g>

    <!-- Engine 4: Stage 11 Health & Testing -->
    <g transform="translate(860, 20)">
      <text x="0" y="16" class="font-sans card-title" font-size="13">Stage 11: Production Health</text>
      <text x="0" y="34" class="font-mono tag" fill="#a78bfa">Pre-Flight &amp; 257 Tests</text>
      <text x="0" y="54" class="font-sans card-desc">• Config Validator &amp; Diagnostics</text>
      <text x="0" y="70" class="font-sans card-desc">• 100% Deterministic Reproducibility</text>
    </g>
  </g>
</svg>
